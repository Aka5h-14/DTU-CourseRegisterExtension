<!DOCTYPE html>
<html>
<head>
  <title>DTU Course Auto-Register</title>
  <style>
    body { font-family: Arial, sans-serif; width: 300px; }
    label, input, select, button { display: block; margin: 8px 0; width: 100%; }
    #intervalCount { font-weight: bold; color: #007bff; }
    #notice { color: #b00; font-size: 15px; margin-top: 8px; }
    #intervalCountDiv { font-weight: bold; font-size: 15px; color: #007bff; }
  </style>
</head>
<body>
  <button id="fetchBtn">Fetch Courses</button>
  <div id="coursesSection" style="display:none;">
    <h3>Select Course</h3>
    <select id="courseSelect"></select>
    <label>Interval (seconds): <input id="intervalInput" type="number" min="1.5" step="0.1" value="3"></label>
    <button id="startBtn">Start Monitoring</button>
    <button id="stopBtn">Stop Monitoring</button>
    <div id="status"></div>
    <div id="intervalCountDiv">Interval runs: <span id="intervalCount">0</span></div>
  </div>
  <div id="notice">Please use the Stop Monitoring button before closing this popup.</div>
  <script src="popup.js"></script>
</body>
</html>
